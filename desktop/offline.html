<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nerdearla Live no está iniciado</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f2f5f3; color:#24332b; font:16px/1.6 system-ui,sans-serif; }
    main { max-width:560px; margin:20px; padding:34px; border:1px solid #dce6df; border-radius:16px; background:white; box-shadow:0 12px 36px #173a2614; }
    h1 { font-size:24px; }
    p { color:#617168; }
    button { border:0; border-radius:8px; background:#20734f; color:white; padding:12px 18px; font:inherit; cursor:pointer; }
    code { background:#f0f4f1; padding:2px 5px; border-radius:4px; }
  </style>
</head>
<body>
  <main>
    <h1>Nerdearla Live no está iniciado</h1>
    <p>La app nativa está abierta, pero no encuentra el servidor local en <code>http://localhost:3001</code>.</p>
    <p>Iniciá Docker con <code>docker compose up -d</code> desde la carpeta del proyecto y volvé a intentar.</p>
    <button onclick="location.assign('http://localhost:3001/')">Reintentar conexión</button>
  </main>
</body>
</html>
